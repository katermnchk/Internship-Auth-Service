spring:
  application:
    name: InnowiseAuthentificationService

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/main-changelog.xml

management:
  endpoints:
    web:
      exposure:
        include: "health,liveness,readiness"
  endpoint:
    health:
      probes:
        enabled: true

security:
  jwt:
    secret-key: ${JWT_SECRET:mySuperSuperSecretDefaultSecretKey}
    access-token-expiration: ${JWT_ACCESS_EXP:900000}
    refresh-token-expiration: ${JWT_REFRESH_EXP:604800000}

app:
  api:
    base-path: /api/v1

internal:
  api:
    header-name: "Internal-Service-Secret"
    secret: ${INTERNAL_API_SECRET}

server:
  port: ${SERVER_PORT:8080}